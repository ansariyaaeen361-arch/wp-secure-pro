name: Build and sign plugin release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP
        run: |
          mkdir -p dist/wp-secure-pro
          rsync -a --delete \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            ./ dist/wp-secure-pro/
          cd dist
          zip -qr ../wp-secure-pro-${GITHUB_REF_NAME#v}.zip wp-secure-pro

      - name: Sign ZIP with Ed25519
        env:
          SIGNING_KEY: ${{ secrets.SWPS_UPDATE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > signing-key.pem
          chmod 600 signing-key.pem
          openssl pkeyutl -sign -rawin -inkey signing-key.pem \
            -in wp-secure-pro-${GITHUB_REF_NAME#v}.zip \
            -out wp-secure-pro-${GITHUB_REF_NAME#v}.zip.sig
          rm -f signing-key.pem

      - name: Publish signed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            wp-secure-pro-${GITHUB_REF_NAME#v}.zip \
            wp-secure-pro-${GITHUB_REF_NAME#v}.zip.sig \
            --generate-notes
